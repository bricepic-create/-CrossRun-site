name: Mirror CrossRun OTA assets

on:
  push:
    branches:
      - cloudflare/crossrun-ota-proxy
    paths:
      - .github/workflows/mirror-crossrun-ota.yml
      - cloudflare-worker/scripts/mirror-current-ota.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crossrun-ota-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout relay branch
        uses: actions/checkout@v4

      - name: Download and verify the approved OTA
        run: node cloudflare-worker/scripts/mirror-current-ota.mjs

      - name: Commit verified mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cloudflare-worker/public cloudflare-worker/mirror-report.json
          if git diff --cached --quiet; then
            echo "Mirror already current"
          else
            git commit -m "Mirror verified CrossRun OTA assets"
            git push origin HEAD:cloudflare/crossrun-ota-proxy
          fi
